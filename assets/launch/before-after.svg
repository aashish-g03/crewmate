<svg xmlns="http://www.w3.org/2000/svg" width="800" height="430" viewBox="0 0 800 430">
  <style>
    .h{font:700 22px -apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#e6edf3}
    .t{font:500 17px -apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#c9d1d9}
    .m{font:600 16px ui-monospace,SFMono-Regular,Menlo,monospace}
    .bad{fill:#ff7b72}.good{fill:#3fd0a0}.dim{fill:#8b949e}
  </style>
  <rect width="800" height="430" rx="16" fill="#0d1117"/>
  <rect x="20" y="20" width="370" height="390" rx="12" fill="#161b22" stroke="#30363d"/>
  <rect x="410" y="20" width="370" height="390" rx="12" fill="#161b22" stroke="#3fd0a0" stroke-opacity=".6"/>
  <text x="44" y="60" class="h">v0.2</text><text x="104" y="60" class="t dim">mailbox + worker pool + MCP</text>
  <text x="434" y="60" class="h">v1</text><text x="476" y="60" class="t dim">one plugin, zero deps</text>

  <text x="44" y="104" class="t">Install</text>
  <text x="44" y="132" class="m bad">7 commands + a terminal</text>
  <text x="44" y="156" class="m bad">kept open for `crewmate up`</text>
  <text x="434" y="104" class="t">Install</text>
  <text x="434" y="132" class="m good">/plugin marketplace add …</text>
  <text x="434" y="156" class="m good">/plugin install crewmate@crewmate</text>

  <text x="44" y="204" class="t">While a job runs</text>
  <text x="44" y="232" class="m bad">nothing, until the end</text>
  <text x="434" y="204" class="t">While a job runs</text>
  <text x="434" y="232" class="m good">each step, in the chat</text>

  <text x="44" y="280" class="t">Pool not started</text>
  <text x="44" y="308" class="m bad">task waits, times out</text>
  <text x="434" y="280" class="t">No daemon</text>
  <text x="434" y="308" class="m good">first job starts its runner</text>

  <text x="44" y="356" class="t">A vendor fails</text>
  <text x="44" y="384" class="m bad">reported "completed"</text>
  <text x="434" y="356" class="t">A vendor fails</text>
  <text x="434" y="384" class="m good">failed · reason · denied tools</text>
</svg>
