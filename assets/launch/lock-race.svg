<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420">
  <style>
    .h{font:700 20px -apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#e6edf3}
    .t{font:500 16px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#c9d1d9}
    .lab{font:700 17px ui-monospace,SFMono-Regular,Menlo,monospace}
    .bad{fill:#ff7b72}.a{fill:#3fd0a0}.b{fill:#7aa7ff}.dim{fill:#8b949e}
  </style>
  <rect width="800" height="420" rx="16" fill="#0d1117"/>
  <text x="32" y="44" class="h">The race both vendors found in crewmate's writer lock</text>
  <text x="32" y="70" class="t dim">two write jobs start while an old, abandoned lock is still on disk</text>
  <line x1="150" y1="100" x2="150" y2="330" stroke="#30363d" stroke-width="2"/>
  <text x="32" y="130" class="lab a">job A</text>
  <text x="32" y="262" class="lab b">job B</text>
  <line x1="150" y1="122" x2="770" y2="122" stroke="#3fd0a0" stroke-opacity=".35" stroke-width="2"/>
  <line x1="150" y1="254" x2="770" y2="254" stroke="#7aa7ff" stroke-opacity=".35" stroke-width="2"/>
  <!-- steps -->
  <circle cx="190" cy="122" r="7" class="a"/><text x="172" y="160" class="t">1 sees old lock</text>
  <circle cx="190" cy="254" r="7" class="b"/><text x="172" y="292" class="t">1 sees old lock</text>
  <circle cx="400" cy="122" r="7" class="a"/><text x="352" y="160" class="t">2 deletes it,</text><text x="352" y="180" class="t">takes the lock</text>
  <circle cx="600" cy="254" r="7" fill="#ff7b72"/><text x="520" y="292" class="t bad">3 deletes A's NEW lock</text><text x="520" y="312" class="t bad">   takes it too</text>
  <line x1="600" y1="244" x2="600" y2="134" stroke="#ff7b72" stroke-width="2" stroke-dasharray="5 5"/><text x="586" y="128" class="lab bad">✗</text><text x="616" y="160" class="t bad">A's lock gone</text>
  <text x="32" y="372" class="t bad">→ two jobs edit your files at once.</text>
  <text x="32" y="398" class="t a">Fix: check-and-take runs under a short mutex;</text><text x="482" y="398" class="t a">a test replays the timing.</text>
</svg>
