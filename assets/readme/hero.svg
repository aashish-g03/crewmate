<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="crewmate: Claude Code hands work to Codex and Gemini and streams their progress back">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1016"/>
      <stop offset="1" stop-color="#0f1d24"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#7ee0d0" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#7ee0d0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
  </defs>
  <style>
    .word{font:800 64px ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#e6edf3;letter-spacing:-1.5px}
    .tag{font:500 17px ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#9fb0bf}
    .mono{font:600 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .node{fill:#111a22;stroke-width:1.5}
    .flow{fill:none;stroke-width:2;stroke-dasharray:6 10;animation:dash 1.6s linear infinite}
    .back{fill:none;stroke-width:1.5;stroke-dasharray:2 9;stroke-opacity:.7;animation:dashback 2.2s linear infinite}
    .pulse{animation:pulse 1.6s ease-in-out infinite}
    .blink{animation:blink 1.1s steps(1) infinite}
    @keyframes dash{to{stroke-dashoffset:-32}}
    @keyframes dashback{to{stroke-dashoffset:22}}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
    @keyframes blink{50%{opacity:0}}
  </style>
  <rect width="900" height="300" rx="16" fill="url(#bg)"/>
  <rect width="900" height="300" rx="16" fill="url(#grid)"/>
  <rect width="900" height="300" rx="16" fill="url(#glow)"/>

  <!-- wordmark -->
  <text x="48" y="122" class="word">crewmate<tspan fill="#7ee0d0" class="blink">_</tspan></text>
  <text x="50" y="160" class="tag">Hand work from Claude Code to Codex and Gemini —</text>
  <text x="50" y="184" class="tag">and watch every step land in your conversation.</text>
  <text x="50" y="232" class="mono" fill="#7ee0d0">/plugin install crewmate@crewmate</text>

  <!-- orchestrator -->
  <rect x="540" y="122" width="118" height="54" rx="10" class="node" stroke="#d9a6ff"/>
  <text x="599" y="146" text-anchor="middle" class="mono" fill="#e6edf3">Claude Code</text>
  <text x="599" y="164" text-anchor="middle" class="mono" fill="#8b949e" style="font-weight:500;font-size:11px">orchestrator</text>

  <!-- lanes out -->
  <path d="M658 140 C 700 140, 712 86, 748 86" class="flow" stroke="#3fd0a0"/>
  <path d="M658 158 C 700 158, 712 212, 748 212" class="flow" stroke="#7aa7ff"/>
  <!-- progress back -->
  <path d="M748 100 C 716 100, 706 150, 660 150" class="back" stroke="#3fd0a0"/>
  <path d="M748 198 C 716 198, 706 150, 660 150" class="back" stroke="#7aa7ff"/>

  <!-- vendors -->
  <rect x="748" y="62" width="112" height="48" rx="10" class="node" stroke="#3fd0a0"/>
  <circle cx="766" cy="86" r="4" fill="#3fd0a0" class="pulse"/>
  <text x="780" y="91" class="mono" fill="#e6edf3">Codex</text>

  <rect x="748" y="188" width="112" height="48" rx="10" class="node" stroke="#7aa7ff"/>
  <circle cx="766" cy="212" r="4" fill="#7aa7ff" class="pulse" style="animation-delay:.8s"/>
  <text x="780" y="217" class="mono" fill="#e6edf3">Gemini</text>

  <text x="599" y="262" text-anchor="middle" class="mono" fill="#8b949e" style="font-weight:500;font-size:11px">jobs · live progress · zero-context critique</text>
</svg>
